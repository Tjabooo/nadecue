[package]
name = "nadecue"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "CS2 grenade lineups that appear when you pull out the grenade and vanish when you throw it"
license = "MIT"
repository = "https://github.com/Tjabooo/nadecue"
readme = "README.md"
keywords = ["cs2", "lineups", "overlay", "linux", "wayland"]
categories = ["command-line-utilities", "games"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
